name: Daily Contribution Automation

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Likethan"
          git config user.email "173385979+Likethan@users.noreply.github.com"

      - name: Update activity marker
        run: |
          mkdir -p .github/automation
          printf 'Last automated update: %s\n' "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/automation/activity.log
          git add .github/automation/activity.log
          git commit -m "chore: daily activity update" || exit 0
          git push
